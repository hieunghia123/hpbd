<!DOCTYPE html>
<html lang="vi">

<head>
    <title>HPBD HHNT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/css01.css">

    <link href="https://fonts.googleapis.com/css?family=Fredoka+One" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans" rel="stylesheet">
</head>

<body>

    <div class="container-fluid">
        <div class="jumbotron img_banner_hpbd text-center">
            <div class="banner-title text-danger bg-danger">
                <h1>TO: HÀ PHƯƠNG</h1>
            </div>
        </div>
    </div>

    <!-- Khung thiệp chính trên trang -->
    <div class="container main-content">
        <div class="row">
            <div id="bond" class="col-xs-12 col-sm-8 col-sm-offset-2 text-center">
                <img data-toggle="modal" data-target="#myModal" 
                     class="img-responsive img-thumbnail img-card bg-snow-tranparent-hidden"
                     src="img/Winter happy birthday.jpg" 
                     alt="Happy Birthday Card">
            </div>
        </div>
    </div>

    <!-- Modal hiển thị chi tiết thiệp -->
    <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title text-info" id="myModalLabel">Thiệp sinh nhật</h4>
                </div>
                <div class="modal-body text-center">
                    <div class="containeri">
                        <img class="img img-responsive" src="img/Winter happy birthday.jpg" alt="Winter happy birthday">
                        <audio controls autoplay>
                            <source src="ms/hpbd.MP3" type="audio/mpeg" />
                            <source src="ms/hppd.MP3" type="audio/mpeg" />
                            Trình duyệt của bạn không hỗ trợ phát âm thanh.
                        </audio>
                    </div>
                    <div class="containeri" style="margin-top: 15px;">
                        <img class="img img-responsive" src="img/Nội dung đoạn văn bản của bạn.png" alt="Nội dung">
                    </div>
                    <div class="containeri" style="margin-top: 15px;">
                        <img class="img img-responsive" src="img/phuong.jpg" alt="Hình ảnh Phương">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="container-fluid footer navbar-fixed-bottom">
        <div class="container text-center">
            <p class="footer-text">HAPPY BIRTHDAY TO YOU!</p>
        </div>
    </footer>

    <script src="js/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/snowstorm-min.js"></script>
    <script src="js/js01.js"></script>

</body>

</html>
